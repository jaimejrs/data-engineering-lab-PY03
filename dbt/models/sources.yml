version: 2

sources:
  - name: silver
    description: "Tabelas Iceberg da camada Silver, escritas pelo Spark (src/spark_jobs/silver_job.py)."
    database: iceberg   # dbt-trino: database == catálogo Trino
    schema: silver
    tables:
      - name: empenhos
        description: "Chave de negócio composta (id, ano) — id sozinho se repete entre anos, sem PK real na origem."
        columns:
          - name: id
            tests: [not_null]
          - name: ano
            tests: [not_null]
      - name: ordem_bancaria_orcamentaria
        description: "Chave de negócio composta (id, ano) — mesma lógica de empenhos."
        columns:
          - name: id
            tests: [not_null]
          - name: ano
            tests: [not_null]
      - name: unidade_gestora
        description: "Chave de negócio composta (codigo, ano) — snapshot anual por unidade gestora."
        columns:
          - name: codigo
            tests: [not_null]
          - name: ano
            tests: [not_null]
      - name: contratos
        description: "Chave de negócio: id (único, sem composição com ano)."
        columns:
          - name: id
            tests: [not_null, unique]

  - name: ml_scores
    description: >
      Tabelas Gold escritas pelos scripts de ML (models/), não pelo dbt — o
      score/previsão de cada modelo. `fato_contrato` faz LEFT JOIN em
      `score_anomalia_contrato` (ver dbt/models/marts/fato_contrato.sql); como
      `fato_contrato` é materialized='table' (recriada a cada build), gravar o
      score aqui em vez de fazer UPDATE direto no fato evita que o build
      seguinte apague o resultado do modelo. Schema físico `ml` (não `gold`)
      desde 26/07/2026 — separado do modelo dimensional por propósito (ver
      docs/03-pendencias-e-melhorias.md).
    database: iceberg
    schema: ml
    tables:
      - name: score_anomalia_contrato
        description: "Score de anomalia (Modelo 1, Isolation Forest) por (id_contrato_origem, ano). Ver models/anomaly_detection.py."
        columns:
          - name: id_contrato_origem
            tests: [not_null]
          - name: ano
            tests: [not_null]
      - name: previsao_pagamento_orgao
        description: "Previsão de pagamento por órgão/trimestre (Modelo 2, XGBoost quantile). Ver models/payment_forecast.py."
        columns:
          - name: codigo_orgao
            tests: [not_null]
          - name: ano_previsto
            tests: [not_null]
          - name: trimestre_previsto
            tests: [not_null]
      - name: relatorio_narrativo
        description: "Relatório narrativo gerado por LLM a partir dos scores/previsões dos Modelos 1/2. Ver models/narrative_report.py."
        columns:
          - name: gerado_em
            tests: [not_null]

  - name: audit
    description: >
      Tabelas de auditoria/observabilidade escritas por código Python fora do
      dbt (DAGs), não pipelines de negócio. `bronze_ingestao` é gravada pela
      task `validate` da DAG 1 (src/reconciliation.py) — item 6 de
      docs/06-analise-critica.md. Schema físico `audit` (não `gold`) desde
      26/07/2026 — separado do modelo dimensional por propósito.
    database: iceberg
    schema: audit
    tables:
      - name: bronze_ingestao
        description: "Contagem de registros validados na Bronze por (fonte, data_extracao). Uma linha por execução da DAG 1; soma por fonte é o total processado até agora. Chave de negócio composta (fonte, data_extracao)."
        columns:
          - name: fonte
            tests: [not_null]
          - name: data_extracao
            tests: [not_null]
      - name: infra_metricas_containers
        description: "CPU/memória por container, coletado a cada 5min via cron. Ver deploy/server-lakehouse/collect_infra_metrics.py. Telemetria de série temporal, sem chave de negócio única (múltiplas linhas por container são esperadas)."
        columns:
          - name: coletado_em
            tests: [not_null]
      - name: infra_metricas_disco
        description: "Uso de disco por ponto de montagem do host, coletado a cada 5min via cron. Ver deploy/server-lakehouse/collect_infra_metrics.py. Telemetria de série temporal, sem chave de negócio única."
        columns:
          - name: coletado_em
            tests: [not_null]
      - name: sessoes_ssh
        description: "Login/logout de sessão SSH, coletado a cada 5min via cron. Ver deploy/server-lakehouse/collect_access_audit.py. Telemetria de evento, sem chave de negócio única."
        columns:
          - name: timestamp_evento
            tests: [not_null]
      - name: comandos_executados
        description: "Comando executado por usuário logado, coletado a cada 5min via cron. Ver deploy/server-lakehouse/collect_access_audit.py. Telemetria de evento, sem chave de negócio única."
        columns:
          - name: timestamp_evento
            tests: [not_null]
