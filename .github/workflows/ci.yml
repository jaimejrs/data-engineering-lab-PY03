name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nenhum job escreve no repositório/PR — leitura só.
permissions:
  contents: read

# Cancela o run anterior do mesmo branch quando chega um push novo, em vez
# de deixar runs supersedidos rodando até o fim à toa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (lint + format check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Instala ruff
        run: pip install ruff==0.6.9
      - name: ruff check (lint)
        run: ruff check .
      - name: ruff format --check (formatação)
        run: ruff format --check .

  tests:
    name: pytest + compile jobs Spark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Instala dependências de teste (subset leve — versões alinhadas com requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 pyarrow==15.0.2 python-dotenv==1.0.1 "sqlalchemy<2.0" \
            requests==2.32.3 psycopg2-binary==2.9.9 hdfs==2.7.3 pytest==8.2.2 \
            scikit-learn==1.5.0 joblib==1.4.2 xgboost==2.0.3 trino==0.328.0 pyyaml==6.0.2 openai==1.51.0 mlflow==2.14.1
      - name: pytest (regras/normalização/extractors)
        run: pytest -q
      - name: Compila os jobs PySpark (sintaxe; pyspark não instalado)
        run: python -m py_compile src/spark_jobs/*.py

      - name: Compila os módulos de ML e as DAGs (sintaxe; airflow não instalado)
        run: python -m py_compile models/*.py dags/*.py

  spark-tests:
    name: pytest (Spark local + Iceberg — normalização e idempotência do MERGE INTO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Instala pyspark (não faz parte da suíte leve do job `tests`)
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 python-dotenv==1.0.1 pytest==8.2.2 pyspark==3.5.3
      - name: pytest (tests/test_silver_job_spark.py — Spark local[1] + Iceberg em catálogo hadoop, sem HMS/HDFS)
        run: pytest -q tests/test_silver_job_spark.py

  dbt:
    name: dbt parse (valida projeto/modelos)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Instala dbt-trino
        run: pip install "dbt-trino==1.8.4"
      - name: dbt parse (não conecta ao Trino — valida refs/macros/testes)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: dbt parse

  dbt-integration:
    name: dbt build (Trino+Iceberg+HMS real, dado sintético mínimo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Achado (26/07/2026, análise crítica): o job `dbt` acima só faz `dbt
    # parse` — nunca conecta no Trino, então nenhum teste (not_null, unique,
    # relationships, os testes singulares assert_*.sql) jamais rodou de
    # verdade em CI, só manualmente contra produção. Este job sobe uma stack
    # Trino+Iceberg+Hive Metastore real, mas sem HDFS (warehouse em disco
    # local, file://) — validado interativamente contra o servidor de
    # produção antes de escrever este workflow (ver histórico da sessão).
    # Objetivo é pegar regressão de SQL/lógica (coluna errada, join quebrado,
    # teste com erro de sintaxe), não validar volume/qualidade de produção —
    # isso continua sendo responsabilidade da rotina manual (ver
    # docs/03-pendencias-e-melhorias.md).
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Builda as imagens base (mesmas do servidor, HDFS_HOST é ignorado depois) — com cache de camada (GHA)
        run: |
          docker buildx build --load -t datalab-hive-metastore:local ./docker/hive \
            --build-arg HDFS_HOST=localhost --build-arg METASTORE_DB_HOST=postgres \
            --cache-from type=gha,scope=hive-base --cache-to type=gha,mode=max,scope=hive-base
          docker buildx build --load -t datalab-trino:local ./docker/trino --build-arg HDFS_HOST=localhost \
            --cache-from type=gha,scope=trino-base --cache-to type=gha,mode=max,scope=trino-base

      - name: Builda as imagens CI (warehouse file:// em vez de hdfs://)
        # Sem buildx aqui de propósito: o builder do buildx (driver
        # docker-container, usado p/ suportar --cache-to type=gha acima) não
        # enxerga o image store local do daemon — como este FROM referencia
        # datalab-hive-metastore:local/datalab-trino:local (imagens só locais,
        # sem registry), buildx tentava fazer PULL delas e falhava com "pull
        # access denied". `docker build` normal usa o driver padrão, que
        # compartilha o image store do daemon — funciona direto. Camada
        # trivial (1 COPY) sobre uma base que já muda a cada run mesmo, cache
        # não traria ganho aqui de qualquer forma.
        run: |
          docker build -t hive-metastore-ci:local -f .github/ci/Dockerfile.hive-ci .github/ci
          docker build -t trino-ci:local -f .github/ci/Dockerfile.trino-ci .github/ci

      - name: Sobe rede/volume isolados
        run: |
          docker network create ci_net
          docker volume create ci_warehouse

      - name: Sobe Postgres (backing store do metastore)
        run: |
          docker run -d --name postgres --network ci_net \
            -e POSTGRES_USER=hive -e POSTGRES_PASSWORD=hive -e POSTGRES_DB=metastore postgres:15
          for i in $(seq 1 15); do
            docker exec postgres pg_isready -U hive >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Sobe Hive Metastore
        run: |
          docker run -d --name hive-metastore --network ci_net -v ci_warehouse:/warehouse hive-metastore-ci:local
          for i in $(seq 1 20); do
            docker exec hive-metastore bash -c 'echo > /dev/tcp/localhost/9083' 2>/dev/null && break
            sleep 2
          done
          docker logs hive-metastore --tail 30

      - name: Sobe Trino (porta publicada — dbt roda no runner, não em container)
        run: |
          docker run -d --name trino --network ci_net -p 8080:8080 -v ci_warehouse:/warehouse trino-ci:local
          for i in $(seq 1 20); do
            status=$(docker inspect trino --format '{{.State.Health.Status}}' 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          docker logs trino --tail 30

      - name: Corrige permissão do warehouse (trino roda como uid 1000, volume nasce root)
        run: docker exec --user root trino chmod -R 777 /warehouse

      - name: Cria os schemas (diretório <schema>.db é criado pelo Hive Metastore, não pelo Trino)
        run: docker exec trino trino --execute "$(cat .github/ci/dbt-seed-schemas.sql)"

      - name: Corrige permissão de novo (HMS acabou de criar os diretórios de schema como root)
        run: docker exec --user root trino chmod -R 777 /warehouse

      - name: Popula dado sintético mínimo (Silver + tabelas de ml/audit)
        run: docker exec trino trino --execute "$(cat .github/ci/dbt-seed-tables.sql)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Instala dbt-trino
        run: pip install "dbt-trino==1.8.4"

      - name: dbt build (real — models, snapshot, todos os testes)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DBT_TRINO_HOST: localhost
        run: dbt build

      - name: Logs do Trino/HMS em caso de falha
        if: failure()
        run: |
          docker logs trino --tail 100 || true
          docker logs hive-metastore --tail 100 || true
