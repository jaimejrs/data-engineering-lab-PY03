[pytest]
; Garante `import src...`/`import models...` nos testes independente de como
; o pytest é invocado (`pytest` direto no CI não adiciona a raiz do repo ao
; sys.path como `python -m pytest` faz localmente — sem isso, o CI quebra com
; ModuleNotFoundError em todo teste que importa src/ ou models/).
pythonpath = .
